<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Nanda's | Awards & Achievements</title>
  <link rel="stylesheet" href="style3.css" />
</head>
<body>
  <section id="awards" class="events-section">
  <h1 class="section-title">Moments That Made Us</h1>
  <p class="section-subtitle">
    A celebration of milestones across generations of Team Nanda’s
  </p>

  <!-- Gallery Grid -->
  <div class="gallery">

    <div class="event-card fade-in" onclick="openGallery(0)">
      <img src="images/img17.jpg" alt="Graphest 2022">
      <div class="overlay">
        <h3>Graphest 2022</h3>
        <span>🏅 Winner – Folk Fusion</span>
      </div>
    </div>

    <div class="event-card fade-in" onclick="openGallery(1)">
      <img src="images/img18.jpg" alt="Tula's 2023">
      <div class="overlay">
        <h3>Tula’s Institute 2023</h3>
        <span>Growing beyond campus</span>
      </div>
    </div>

  </div>
</section>
<div id="lightbox" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); justify-content:center; align-items:center; z-index:999;">
  
  <div style="position:relative; max-width:900px; width:90%; text-align:center; color:white;">
    
    <span onclick="closeGallery()" style="position:absolute; top:-40px; right:0; font-size:30px; cursor:pointer; color:#ffcc00;">&times;</span>

    <h2 id="lightbox-title"></h2>
    <p id="lightbox-role" style="margin-bottom:20px; color:#ccc;"></p>

    <img id="lightbox-img" style="width:100%; border-radius:10px;">

    <div style="margin-top:20px;">
      <button onclick="prevImage()">⬅</button>
      <button onclick="nextImage()">➡</button>
    </div>

  </div>
</div>
  <script src="script.js"></script>
</body>
</html>
