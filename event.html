<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Nanda's | Awards & Achievements</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<section class="events-masonry">

  <!-- Filters -->
  <div class="masonry-filters">
    <button class="active" data-filter="all">All</button>
    <button data-filter="performance">Performances</button>
    <button data-filter="competition">Competitions</button>
    <button data-filter="festival">Festivals</button>
  </div>

  <!-- Masonry Grid -->
  <div class="masonry-grid">

    <!-- Item -->
    <div class="masonry-item" data-category="competition" onclick="openGallery(0)">
      <img src="images/e1_1.jpg" alt="">
      <div class="overlay">
        <span>Inter-University Cultural Fest • 2022</span>
      </div>
    </div>

    <div class="masonry-item" data-category="competition" onclick="openGallery(0)">
      <img src="images/e1_2.jpg" alt="">
      <div class="overlay">
        <span>Inter-University Cultural Fest • 2022</span>
      </div>
    </div>

    <!-- Item -->
    <div class="masonry-item" data-category="festival" onclick="openGallery(1)">
      <img src="images/e2_1.jpg" alt="">
      <div class="overlay">
        <span>Tula’s Institute Cultural Fest • 2023</span>
      </div>
    </div>

    <div class="masonry-item" data-category="festival" onclick="openGallery(1)">
      <img src="images/e2_2.jpg" alt="">
      <div class="overlay">
        <span>Tula’s Institute Cultural Fest • 2023</span>
      </div>
    </div>

  </div>
</section>

  <button class="nav next" onclick="nextImage()">❯</button>

  </div>
</div> -->

<div id="lightbox" class="lightbox">
  <div class="lightbox-content">

    <span class="close-btn" onclick="closeGallery()">&times;</span>

    <h2 id="lightbox-title"></h2>
    <p id="lightbox-role"></p>

    <!-- Image Grid Container -->
    <div id="lightbox-gallery" class="lightbox-gallery"></div>

  </div>
</div>
<script src="script.js"></script>
</body>
</html>
